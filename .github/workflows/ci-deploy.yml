name: CI/CD Pipeline

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs:
    # ─────────────────────────────────────────────
    # Build & Test
    # ─────────────────────────────────────────────
    build-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            -   name: Setup pnpm
                uses: pnpm/action-setup@v4
                with:
                    version: 9.15.0

            -   name: Setup Node.js
                uses: actions/setup-node@v4
                with:
                    node-version: 22
                    cache: 'pnpm'

            -   name: Install dependencies
                run: pnpm install --frozen-lockfile

            -   name: Type check
                run: pnpm typecheck

            -   name: Run tests
                run: pnpm test

    # ─────────────────────────────────────────────
    # Build & Push Docker Image
    # ─────────────────────────────────────────────
    docker:
        needs: build-test
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        outputs:
            version: ${{ steps.version.outputs.docker_tag }}
        steps:
            - uses: actions/checkout@v4

            -   name: Setup Node.js
                uses: actions/setup-node@v4
                with:
                    node-version: 22

            -   name: Extract version from STATE.md
                id: version
                run: |
                    VERSION=$(BUILD_NUMBER=${{ github.run_number }} COMMIT_SHA=${{ github.sha }} node scripts/extract-version.cjs)
                    DOCKER_TAG=$(echo "$VERSION" | tr '+' '-')
                    echo "version=$VERSION" >> $GITHUB_OUTPUT
                    echo "docker_tag=$DOCKER_TAG" >> $GITHUB_OUTPUT
                    echo "Extracted version: $VERSION (Docker tag: $DOCKER_TAG)"

            -   name: Log in to Container Registry
                uses: docker/login-action@v3
                with:
                    registry: ${{ env.REGISTRY }}
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            -   name: Build and push API image
                uses: docker/build-push-action@v6
                with:
                    context: .
                    push: true
                    tags: |
                        ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.docker_tag }}
                        ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
                    build-args: |
                        BUILD_NUMBER=${{ github.run_number }}
                        COMMIT_SHA=${{ github.sha }}
                        BUILD_DATE=${{ github.event.head_commit.timestamp }}

            -   name: Build and push docs image
                uses: docker/build-push-action@v6
                with:
                    context: ./docs-site
                    push: true
                    tags: |
                        ${{ env.REGISTRY }}/${{ github.repository }}-docs:${{ steps.version.outputs.docker_tag }}
                        ${{ env.REGISTRY }}/${{ github.repository }}-docs:latest
                    build-args: |
                        VERSION=${{ steps.version.outputs.version }}

    # ─────────────────────────────────────────────
    # REMOVED at Phase 15 (2026-08-05) — the production deploy job that targeted the
    # DigitalOcean droplet, together with its three repository secrets
    # (DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY, all deleted in the same change).
    #
    # Production moved to jarvis at the DNS flip of 2026-08-04T12:44:53Z. The droplet
    # is kept only as a frozen rollback image until it is destroyed, and a rollback
    # restarts its existing containers — it never needs a new deploy. Keeping the job
    # would have kept a live credential path into that host for no benefit.
    #
    # This satisfies the last clause of DEPLOY-04 ("the droplet is no longer
    # redeployed") as a fact rather than as a comment: the proof is
    # `gh api repos/toto-castaldi/docora/actions/secrets --jq .total_count` = 0.
    # Do NOT restore this job.
    # ─────────────────────────────────────────────

    # ─────────────────────────────────────────────
    # Deploy to jarvis — since Phase 15 this is the ONLY deploy job, and jarvis is
    # production. It was previously the sibling of the removed droplet job and it keeps
    # `needs: docker` unchanged: nothing about its trigger surface was widened here.
    #
    # This job runs on a SELF-HOSTED runner that holds exactly one NOPASSWD sudo
    # entitlement (/usr/local/sbin/docora-deploy.sh). Because this repository is public,
    # the job is deliberately narrow: push-on-main only, no repository checkout, a
    # read-only token, and no expression interpolation inside run:.
    # ─────────────────────────────────────────────
    deploy-jarvis:
        needs: docker
        # Three independent clauses — a fork PR can never reach the runner:
        #   repository (not a fork) + event_name (never a pull request) + ref (main only).
        if: >-
            github.repository == 'toto-castaldi/docora'
            && github.event_name == 'push'
            && github.ref == 'refs/heads/main'
        runs-on: [self-hosted, jarvis, docora]
        permissions:
            # Least privilege: this job performs no checkout and calls no GitHub API.
            contents: read
        concurrency:
            group: deploy-jarvis-docora
            # DELIBERATE: never cancel a running deploy. Mid-run this job is a
            # `liquibase update` applying changesets; cancelling it can leave the schema
            # half-migrated or the changelog lock held. A queued deploy is fine; an
            # interrupted migration is not. Do NOT change this to true.
            cancel-in-progress: false
        steps:
            # NO repository checkout, deliberately: this job builds nothing and reads no
            # repo file — it only needs the build tag string. Not checking out means no
            # repo-controlled content ever lands on the machine holding the root
            # entitlement. Do not add one for convenience.
            -   name: Deploy Docora to jarvis
                env:
                    # Intermediate env var (GitHub's documented script-injection
                    # mitigation): the expression never enters the run: body.
                    BUILD_TAG: ${{ needs.docker.outputs.version }}
                run: |
                    set -euo pipefail
                    # Quoted shell expansion. The tag is the ONLY value crossing the sudo
                    # boundary: no path, no flag, no service or compose project name.
                    # The script's exit code is the job's verdict (0 green; 64/65 argument
                    # rejected; 70 digest unresolvable; 71/72 app absent or wrong build;
                    # 73/74 .env or Postgres volume touched).
                    sudo -n /usr/local/sbin/docora-deploy.sh "$BUILD_TAG"
            # NOTE: there is no deploy.log append here. Unlike this project's other
            # self-hosted runners, the log writer is root inside the script and the file is
            # /var/lib/docora-deploy/deploy.log (root:root 0644) — the runner cannot forge
            # entries. Do not "restore" a missing append line here.
