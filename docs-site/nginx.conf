server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    # HSTS is set here because the reverse proxy used to supply it, and that proxy
    # is going away: on the new host the docs origin is published straight through a
    # Cloudflare Tunnel, with no Caddy in front to add the header. Setting it at the
    # origin keeps the directive scoped to this host and versioned in git, instead of
    # relying on a zone-wide edge toggle.
    # `always` matters: without it nginx omits the header on error responses.
    # `preload` is deliberately NOT reproduced. It is only meaningful for the
    # registrable domain, never for a subdomain, so the proxy's `preload` on this host
    # never did anything; copying it would be byte-equality theatre.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Cache static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA-style routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}
